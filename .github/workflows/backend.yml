name: Backend checks
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: unihome_ci
          POSTGRES_USER: unihome_ci
          POSTGRES_PASSWORD: ci-only-password
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DJANGO_DEBUG: 'true'
      DJANGO_SECRET_KEY: ci-only-non-production-secret
      POSTGRES_DB: unihome_ci
      POSTGRES_USER: unihome_ci
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_HOST: localhost
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - name: Install video inspection tool
        run: |
          sudo apt-get update
          sudo apt-get install --yes ffmpeg
          ffprobe -version
      - run: pip install -r requirements-dev.txt
      - run: pip check
      - run: python manage.py check
      - run: python manage.py makemigrations --check --dry-run
      - run: python manage.py migrate --noinput
      - run: python manage.py test --verbosity 2
      - name: Production settings checks
        env:
          DJANGO_DEBUG: 'false'
          DJANGO_SECRET_KEY: ci-only-production-shape-secret-never-use-this-value-for-any-real-deployment-123456789
          DJANGO_ALLOWED_HOSTS: unihome.example
          DJANGO_HSTS_INCLUDE_SUBDOMAINS: 'true'
          DJANGO_HSTS_PRELOAD: 'true'
        run: python manage.py check --deploy --fail-level WARNING
